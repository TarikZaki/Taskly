<div class="relative">
    <input class="form-control pr-12" [attr.id]="inputId()" [type]="visible() ? 'text' : 'password'"
        [placeholder]="errorText() ?? placeholder()" [value]="value()" [disabled]="disabled()" (input)="onInput($event)"
        (blur)="onTouched()" />
    <button type="button" class="absolute inset-y-0 right-4 flex items-center text-surface-medium"
        [attr.aria-label]="visible() ? 'Hide password' : 'Show password'" (click)="visible.update((v) => !v)">
        @if (visible()) {
        <img class="size-4" src="/icons/eye-off.svg" alt="eye off icon" />
        } @else {
        <img class="size-4" src="/icons/eye.svg" alt="eye icon" />
        }
    </button>
</div>
