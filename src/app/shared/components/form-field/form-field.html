<!-- form-field.html -->
<div class="flex flex-col gap-2">
    <label [attr.for]="forId()" class="text-label-sm font-label-sm uppercase" [class.text-slate-600]="!error()"
        [class.text-error]="error()">
        {{ label() }}
    </label>

    <ng-content />

    @if (hint()) {
    <p class="text-label-sm tracking-normal text-slate-300">{{ hint() }}</p>
    }
</div>
